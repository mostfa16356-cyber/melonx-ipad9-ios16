name: Build MeloNX iPad 9 TrollStore IPA

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    # The app's Release config targets the iOS 26.2 SDK, so we need the
    # macOS 26 image (ships Xcode 26.x). macos-15 runners top out at Xcode 16.
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Make dotnet visible to Xcode's build script
        run: sudo ln -sf "$(command -v dotnet)" /usr/local/bin/dotnet

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)/Contents/Developer"
          xcodebuild -version

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ios-core-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'nuget.config') }}

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project src/MeloNX/MeloNX.xcodeproj \
            -scheme MeloNX \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MeloNX.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            SWIFT_OPTIMIZATION_LEVEL=-Onone

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/MeloNX.xcarchive/Products/Applications/MeloNX.app build/Payload/
          codesign --force --deep --sign - \
            --entitlements src/MeloNX/MeloNX/MeloNX.entitlements \
            build/Payload/MeloNX.app
          codesign --verify --deep --strict build/Payload/MeloNX.app
          codesign -d --entitlements :- build/Payload/MeloNX.app > build/signed-entitlements.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :get-task-allow' build/signed-entitlements.plist)" = true
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.developer.kernel.increased-memory-limit' build/signed-entitlements.plist)" = true
          cd build
          zip -qry MeloNX-iPad9-iPadOS16.3-TrollStore-fix4.ipa Payload

      - name: Verify minimum iOS version
        run: |
          plist=build/Payload/MeloNX.app/Info.plist
          min_os=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$plist")
          echo "MinimumOSVersion=$min_os"
          python3 -c 'import sys; assert tuple(map(int, sys.argv[1].split("."))) <= (16, 3, 1)' "$min_os"

      - uses: actions/upload-artifact@v4
        with:
          name: MeloNX-iPad9-iPadOS16.3-TrollStore-fix4-ipa
          path: build/MeloNX-iPad9-iPadOS16.3-TrollStore-fix4.ipa
